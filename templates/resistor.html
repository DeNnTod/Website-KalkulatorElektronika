{% extends 'base.html' %}
{% block content %}

<div class="card card-pro p-4 shadow">

<h3 class="text-center mb-3">🔌 Resistor Calculator</h3>

<form method="POST" id="formResistor">

<select name="mode" id="mode" class="form-select mb-3">
<option value="4">4 Gelang</option>
<option value="5">5 Gelang</option>
</select>

<div class="row g-2">

{% for i in range(1,6) %}
<div class="col-md-2">
<select name="band{{i}}" class="form-select color-select">
<option value="" selected disabled>-- warna --</option>
{% for w in warna_digit %}
<option value="{{w}}">{{w}}</option>
{% endfor %}
</select>
</div>
{% endfor %}

</div>

<button class="btn btn-primary w-100 mt-3">Hitung</button>

</form>

<!-- preview -->
<div class="d-flex mt-4 rounded overflow-hidden" style="height:50px;">
{% for i in range(1,6) %}
<div id="b{{i}}" style="flex:1;background:#ddd"></div>
{% endfor %}
</div>

{% if hasil %}
<div class="alert alert-success mt-3 text-center">{{hasil}}</div>
{% endif %}

</div>

<script>
const map={
"hitam":"black","coklat":"brown","merah":"red","oranye":"orange",
"kuning":"yellow","hijau":"green","biru":"blue","ungu":"purple",
"abu-abu":"gray","putih":"white","emas":"gold","perak":"silver"
};

function update(){
document.querySelectorAll(".color-select").forEach((s,i)=>{
let c=map[s.value];
document.getElementById("b"+(i+1)).style.background=c||"#ddd";
});
}

document.querySelectorAll(".color-select").forEach(s=>{
s.addEventListener("change",function(){
this.style.background=map[this.value];
this.style.color="white";
update();
});
});
</script>

{% endblock %}
